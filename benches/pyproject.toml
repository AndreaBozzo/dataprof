[project]
name = "dataprof-comparison-benchmarks"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dataprof",
    "pandas==2.3.3",
    "polars==1.44.1",
    "ydata-profiling==4.18.4",
    "psutil==7.2.2",
    # ydata-profiling imports pkg_resources, removed in newer setuptools.
    # Upgrade this pin and remove the matching Dependabot bound only alongside
    # a ydata version that passes the import preflight without pkg_resources.
    "setuptools==81.0.0",
]

[tool.uv.sources]
dataprof = { path = ".." }

[tool.uv]
package = false
build-constraint-dependencies = ["maturin==1.15.0"]

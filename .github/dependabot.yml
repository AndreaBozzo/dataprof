version: 2
updates:
  # Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"

  # Python dependencies (uv.lock). Without this nothing watched the Python
  # environment, so an advisory against a transitive dev dependency stayed open
  # with no update path — the gap that left Pygments unpatched (#464).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    ignore:
      # The ref on dtolnay/rust-toolchain names a Rust version rather than an
      # action release. That repo pre-creates a branch for every upcoming
      # version, so dependabot reads unreleased ones as available upgrades: it
      # bumped the pin to 1.100 (#521), which rustup cannot install. Rust
      # version bumps here are deliberate; make them by hand.
      - dependency-name: "dtolnay/rust-toolchain"

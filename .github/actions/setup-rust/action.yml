name: 'Setup Rust with Caching'
description: 'Reliable Rust toolchain setup with caching and fallback'
inputs:
  cache-prefix:
    description: 'Cache key prefix (e.g., "benchmark", "quick")'
    required: false
    default: 'rust'
  components:
    description: 'Additional rustup components (comma-separated)'
    required: false
    default: 'rustfmt,clippy'
  targets:
    description: 'Additional Rust targets to install (e.g., "aarch64-unknown-linux-gnu")'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # This ref pins a Rust version. Under `@stable`, every open PR went red the
    # day a Rust release landed, because a new clippy lint fires on code that
    # was already merged (1.98 did this with `clippy::drain_collect`). Bump it
    # deliberately, in step with the versions in `release.yml` and AGENTS.md.
    - name: Install Rust toolchain
      id: rust-install
      uses: dtolnay/rust-toolchain@1.98
      with:
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
      continue-on-error: true
      env:
        RUSTUP_MAX_RETRIES: 3

    - name: Rust toolchain fallback
      if: steps.rust-install.outcome == 'failure'
      shell: bash
      run: |
        echo "Primary Rust installation failed, trying manual installation..."
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
          sh -s -- -y --default-toolchain 1.98
        source ~/.cargo/env
        if [ -n "${{ inputs.components }}" ]; then
          rustup component add $(echo "${{ inputs.components }}" | tr ',' ' ')
        fi
        if [ -n "${{ inputs.targets }}" ]; then
          rustup target add $(echo "${{ inputs.targets }}" | tr ',' ' ')
        fi

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: ${{ inputs.cache-prefix }}
        shared-key: "v4"

    - name: Verify Rust installation
      shell: bash
      run: |
        echo "Rust environment verification..."
        rustc --version
        cargo --version
        echo "Components: $(rustup component list --installed)"

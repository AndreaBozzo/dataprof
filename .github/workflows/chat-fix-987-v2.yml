name: Chat fix 987 v2

on:
  push:
    branches:
      - fix/pandas-container-row-identity-982

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[chat-987-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pandas-container-row-identity-982
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Reset old attempt and apply patch
        shell: bash
        run: |
          BASE=4232d9211afa4ab7ce2b0781258065cabaac92b9
          git checkout "$BASE" -- \
            python/dataprof/__init__.py \
            python/dataprof/interop.py \
            python/dataprof/_inputs.py \
            crates/dataprof-python/src/arrow_export.rs \
            crates/dataprof-parquet/src/lib.rs
          rm -f python/dataprof/_pandas_mixed.py crates/dataprof-parquet/src/row_provenance.rs
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/chat_fix_987.py')
          text = path.read_text()

          old = 'text = replace_once(text, old_loop, new_loop, "analyzer loop")'
          new = '''profile_start = text.index("pub fn profile_dataframe(")
          profile_end = text.index("\\n/// Profile a PyArrow Table", profile_start)
          profile = text[profile_start:profile_end]
          profile = replace_once(profile, old_loop, new_loop, "dataframe analyzer loop")
          text = text[:profile_start] + profile + text[profile_end:]'''
          if text.count(old) != 1:
              raise SystemExit(f'analyzer hotfix target count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''text = replace_once(
              text,
              '    .with_row_duplicates(analyzer.row_duplicate_summary())',
              '    .with_row_duplicates(row_duplicates)',
              "row duplicate assembler",
          )'''
          new = '''profile_start = text.index("pub fn profile_dataframe(")
          profile_end = text.index("\\n/// Profile a PyArrow Table", profile_start)
          profile = text[profile_start:profile_end]
          profile = replace_once(
              profile,
              '    .with_row_duplicates(analyzer.row_duplicate_summary())',
              '    .with_row_duplicates(row_duplicates)',
              "dataframe row duplicate assembler",
          )
          text = text[:profile_start] + profile + text[profile_end:]'''
          if text.count(old) != 1:
              raise SystemExit(f'row-summary hotfix target count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python .github/chat_fix_987.py
          cargo fmt --all
          python -m py_compile python/dataprof/_inputs.py python/tests/test_pandas_container_identity.py
          git diff --check

      - name: Test provenance row tracker
        run: cargo test -p dataprof-parquet --features arrow row_provenance --lib

      - name: Build Python test environment
        run: |
          uv sync
          uv run maturin develop

      - name: Run pandas regression tests
        run: uv run pytest python/tests/test_pandas_container_identity.py python/tests/test_pandas_mixed_columns.py -q

      - name: Commit tested patch
        shell: bash
        run: |
          rm .github/workflows/chat-fix-987-v2.yml .github/chat_fix_987.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(python): preserve container provenance in pandas fallback [chat-987-done]'
          git push origin HEAD:fix/pandas-container-row-identity-982

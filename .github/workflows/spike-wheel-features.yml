# Throwaway spike workflow for #586.
#
# Answers: can the optional Python features be built for every target the
# release matrix publishes, and what do they cost in wheel size?
#
# Mirrors the baseline legs of `python-wheels` in release.yml. The `optimized`
# legs are deliberately absent: they are excluded from the PyPI upload
# (release.yml downloads `wheels-*-baseline` only), so they are irrelevant here.
#
# Delete this file once #586 is answered.
name: Spike - wheel feature matrix

on:
  # A workflow_dispatch-only workflow is not dispatchable until it exists on the
  # default branch, so the spike branch also triggers on push. `inputs` is null
  # for a push event; every use below carries the same default as a fallback.
  #
  # Those push fallbacks are the knob for each experiment while this workflow
  # lives only on the spike branch.
  #
  # Experiment log:
  #   1. scope=linux, sccache=true  -> aarch64 fails building ring:
  #      "ARM assembler must define __ARM_ARCH" (44x). x86_64 green.
  #   2. scope=aarch64, sccache=false -> identical failure, 0 sccache-wrapped
  #      compiler invocations. sccache ruled out as the cause.
  #   3. scope=aarch64 with CFLAGS_aarch64_unknown_linux_gnu=-D__ARM_ARCH=8
  #      -> GREEN. ring, libsqlite3-sys, sqlx-{sqlite,postgres,mysql}, rustls,
  #      reqwest and tokio all compiled; 7 wheels; 0 __ARM_ARCH errors. So the
  #      whole feature set cross-compiles once that one macro is defined.
  #   4. scope=linux, sccache=true, ARM fix retained -> both legs GREEN.
  #      x86_64 re-validated under the strengthened async assertion (runs 1-2
  #      predate it and only checked that dataprof.asyncio imports, which
  #      passes even on a wheel with no async support). aarch64 reproducible.
  #   5. scope=all -> Windows x64 GREEN. macOS x86_64 built fine but died in
  #      the Compare step (BSD wc pads its count, so `bytes=   N` reached the
  #      consumer as `new_bytes= N` and the shell tried to run the number).
  #      macOS aarch64 FAILED: our own `-C target-cpu=generic` strips
  #      neon/aes/sha2/pmull, which ring asserts statically on
  #      aarch64-apple-darwin (src/cpu/arm/darwin.rs).
  #   6. (current) scope=fixes -> verifies both remedies at once:
  #      - Linux aarch64 on manylinux_2_28 (GCC 7.5) with NO -D__ARM_ARCH hack.
  #        ring#1728 is closed WONTFIX, so a newer image is the real fix and
  #        forcing the macro on GCC 4.8.5 crypto code is not.
  #      - macOS aarch64 with no -C target-cpu at all.
  #      Compare step fixed for BSD wc.
  push:
    branches: [feature/586-wheel-feature-spike]
  workflow_dispatch:
    inputs:
      features:
        description: Feature set to build
        required: true
        default: python,python-async,async-streaming,parquet-async,database,postgres,mysql,sqlite
      baseline_version:
        description: Published version to compare wheel size against
        required: true
        default: 0.10.0
      scope:
        description: >-
          linux = ubuntu x86_64 + aarch64 only (aarch64 is the leg most likely
          to fail, and Linux runners bill at 1x). all = add Windows and both
          macOS legs; macOS bills at 10x, so only widen once Linux is green.
        required: true
        default: linux
        type: choice
        options: [linux, aarch64, fixes, all]
      arm_cflags:
        description: >-
          CFLAGS injected into the aarch64 build container for ring's assembly
          step. Empty reproduces the failure. sccache was ruled out as the
          cause, so this tests whether the cross-gcc simply never defines
          __ARM_ARCH.
        required: false
        default: '-D__ARM_ARCH=8'
      sccache:
        description: >-
          Set false to test whether sccache is what breaks ring's aarch64
          assembly build. release.yml sets it true, so keep it true for any
          run whose numbers are meant to represent the real release job.
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

env:
  FEATURES: ${{ inputs.features || 'python,python-async,async-streaming,parquet-async,database,postgres,mysql,sqlite' }}
  BASELINE_VERSION: ${{ inputs.baseline_version || '0.10.0' }}

permissions:
  contents: read

jobs:
  # The matrix is built here rather than inline so `scope` can widen it without
  # editing this file. rustflags are copied verbatim from the baseline legs of
  # `python-wheels` in release.yml; if those change, change them here too.
  plan:
    name: Plan matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          # Emitted as literal JSON rather than assembled with jq: the rustflags
          # values contain no quotes or backslashes, so nothing needs escaping,
          # and this stays checkable by eye.
          X='-C target-cpu=x86-64 -C target-feature=-avx,-avx2,-avx512f -C opt-level=2'
          A='-C target-cpu=generic -C opt-level=2'
          # Apple Silicon: no -C target-cpu. `generic` strips neon/aes/sha2/pmull,
          # which ring asserts are statically present on aarch64-apple-darwin
          # (src/cpu/arm/darwin.rs), and every arm64 Mac has them anyway.
          M='-C opt-level=2'

          linux='
            {"os":"ubuntu-latest","target":"x86_64","rustflags":"'"$X"'","native":true,"pip_platform":"manylinux2014_x86_64"},
            {"os":"ubuntu-latest","target":"aarch64","rustflags":"'"$A"'","native":false,"pip_platform":"manylinux2014_aarch64","manylinux":"2_28"}'
          arm_only='
            {"os":"ubuntu-latest","target":"aarch64","rustflags":"'"$A"'","native":false,"pip_platform":"manylinux2014_aarch64","manylinux":"2_28"}'
          extended='
            {"os":"windows-latest","target":"x64","rustflags":"'"$X"'","native":true,"pip_platform":"win_amd64"},
            {"os":"macos-15-intel","target":"x86_64","rustflags":"'"$X"'","native":true,"pip_platform":"macosx_10_12_x86_64"},
            {"os":"macos-latest","target":"aarch64","rustflags":"'"$M"'","native":true,"pip_platform":"macosx_11_0_arm64"}'

          # `fixes` = only the two legs that were broken, to verify both
          # remedies without paying for the three that already pass.
          fixes="$arm_only,
            {\"os\":\"macos-latest\",\"target\":\"aarch64\",\"rustflags\":\"$M\",\"native\":true,\"pip_platform\":\"macosx_11_0_arm64\"}"

          case "${{ inputs.scope || 'fixes' }}" in
            all)     include="[$linux,$extended]" ;;
            aarch64) include="[$arm_only]" ;;
            fixes)   include="[$fixes]" ;;
            *)       include="[$linux]" ;;
          esac
          include=$(echo "$include" | tr -d '\n' | tr -s ' ')

          # Fail loudly here rather than letting a malformed matrix turn into an
          # inscrutable "fromJSON" error on the downstream job.
          python3 -c "import json,sys; m=json.loads(sys.argv[1]); print('legs:', len(m)); [print('  -', j['os'], j['target'], 'native=%s' % j['native']) for j in m]" "$include"

          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  # Evidence for the ring failure, and for any upstream report about it.
  # ring's asm_base.h asserts that any ARM assembler defines __ARM_ARCH,
  # citing "GCC 4.8+ and Clang 3.2+". This job checks whether that actually
  # holds for the aarch64 cross-gcc in the image maturin-action uses, rather
  # than assuming it. Answers whether the toolchain predates ring's documented
  # floor (not upstream's problem) or is modern and still lacks the macro
  # (a real gap in ring's assumption for aarch64).
  arm-toolchain-probe:
    name: Probe aarch64 cross-gcc for __ARM_ARCH
    runs-on: ubuntu-latest
    container: ghcr.io/rust-cross/manylinux2014-cross:aarch64
    steps:
      - name: Compiler identity and predefined macros
        shell: bash
        run: |
          set -uo pipefail
          cc=aarch64-unknown-linux-gnu-gcc
          echo "## aarch64 cross toolchain probe" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          "$cc" --version 2>&1 | head -1 | tee -a "$GITHUB_STEP_SUMMARY"

          # Once as C, once as preprocessed assembly: ring's failure is on .S
          # files, and the two modes do not have to agree.
          for mode in c assembler-with-cpp; do
            got=$(: | "$cc" -dM -E -x "$mode" - 2>/dev/null | grep -E "__ARM_ARCH|__aarch64__" | sort | xargs)
            echo "mode=$mode -> ${got:-<none>}" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.os }}-${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      # One target failing is a result, not a reason to cancel the others.
      # Knowing exactly which legs break is the entire point of the spike.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Record start time
        id: start
        shell: bash
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build wheel with the full feature set
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # --find-interpreter is required, not optional: inside the manylinux
          # container maturin has no interpreter on PATH to bind to and fails
          # with "Couldn't find any python interpreters". It also matches
          # release.yml:409, so the build time measured here is the real one.
          args: --release --out dist --find-interpreter --features "${{ env.FEATURES }}"
          sccache: ${{ inputs.sccache || 'true' }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          rust-toolchain: stable
          # maturin-action builds Linux wheels inside a container, so a plain
          # `env:` on this step does not reach the compiler. docker-options is
          # the only way to get a variable to the cc crate in there.
          docker-options: -e CFLAGS_aarch64_unknown_linux_gnu=${{ inputs.arm_cflags || '' }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Measure
        id: measure
        shell: bash
        run: |
          set -euo pipefail
          # --find-interpreter produces one wheel per CPython in the container,
          # so report every one rather than sampling the first and calling it
          # "the" size.
          count=$(find dist -name '*.whl' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No wheel produced" >&2
            exit 1
          fi
          elapsed=$(( $(date +%s) - ${{ steps.start.outputs.epoch }} ))

          {
            echo "### ${{ matrix.os }}-${{ matrix.target }}"
            echo ""
            echo "$count wheel(s), ${elapsed}s for the whole step"
            echo ""
            echo "| wheel | KiB |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          for w in dist/*.whl; do
            echo "| \`$(basename "$w")\` | $(( $(wc -c < "$w") / 1024 )) |" >> "$GITHUB_STEP_SUMMARY"
          done

          # Representative wheel for the size comparison below: cp310 if present,
          # otherwise the first, so the delta is computed against a like-for-like
          # interpreter rather than whichever happened to sort first.
          rep=$(find dist -name '*cp310*.whl' | head -n1)
          [ -n "$rep" ] || rep=$(find dist -name '*.whl' | head -n1)
          # tr is load-bearing: BSD wc (macOS) pads its count with leading
          # spaces, so `bytes=   7006536` lands in GITHUB_OUTPUT and the
          # consumer below expands to `new_bytes= 7006536`, which the shell
          # tries to execute. GNU wc does not pad, so Linux never saw it.
          echo "bytes=$(wc -c < "$rep" | tr -d "[:space:]")" >> "$GITHUB_OUTPUT"
          echo "wheel=$(basename "$rep")" >> "$GITHUB_OUTPUT"

      - name: Compare against the published wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline
          # --no-deps so we measure the dataprof wheel alone. If no wheel matches
          # this platform on PyPI, say so rather than silently skipping.
          #
          # --platform is load-bearing: without it pip resolves for the RUNNER,
          # not the build target, so the cross-compiled aarch64 leg silently
          # downloaded an x86_64 wheel and compared against the wrong
          # architecture. --platform requires --only-binary, already present.
          if pip download "dataprof==${{ env.BASELINE_VERSION }}" \
              --no-deps --only-binary=:all: --python-version 310 \
              --platform "${{ matrix.pip_platform }}" -d baseline 2>/dev/null; then
            old=$(find baseline -name '*.whl' | head -n1)
            old_bytes=$(wc -c < "$old")
            new_bytes=${{ steps.measure.outputs.bytes }}
            echo "- published $(basename "$old"): $(( old_bytes / 1024 )) KiB" >> "$GITHUB_STEP_SUMMARY"
            echo "- delta: $(( (new_bytes - old_bytes) / 1024 )) KiB (x$(awk "BEGIN{printf \"%.2f\", $new_bytes/$old_bytes}"))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- published wheel: none matched this platform, no comparison" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Cross-compiled aarch64 Linux wheels cannot run on the x86_64 runner that
      # built them, so the capability assertion is skipped there by necessity.
      # That leg proves buildability only.
      - name: Install the wheel and assert capabilities
        if: matrix.native
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .spike-venv
          if [ -d .spike-venv/Scripts ]; then py=.spike-venv/Scripts/python; else py=.spike-venv/bin/python; fi
          "$py" -m pip install --quiet --upgrade pip
          # Resolve from the dist directory rather than globbing: with several
          # interpreter-specific wheels present, a glob hands pip wheels its
          # interpreter cannot install. --no-index keeps it off PyPI, so a
          # failure here means the local wheel is genuinely unusable.
          "$py" -m pip install --quiet --no-index --find-links dist dataprof
          "$py" -c "import dataprof, sys; print('installed', dataprof.__version__, 'on', sys.version)"
          "$py" - <<'PY'
          import dataprof

          caps = dataprof.capabilities()
          print("capabilities:", caps)

          # Assert on the public capability fields, not on hasattr: the package
          # installs _database_unavailable stubs under the real function names
          # (python/dataprof/__init__.py), so hasattr passes either way and
          # would prove nothing.
          expected = {
              "async_streaming": True,
              "url_profiling": True,
              "remote_parquet": True,
              "database": True,
          }
          bad = {k: getattr(caps, k) for k, v in expected.items() if getattr(caps, k) != v}
          assert not bad, f"missing capabilities: {bad}"
          assert caps.database_connectors == ("postgres", "mysql", "sqlite"), caps.database_connectors

          # capabilities() reads compile-time cfg flags, so exercise the real
          # path too. Importing from dataprof.asyncio proves nothing: the module
          # and its function objects import fine on a wheel with no async
          # support, and the ImportError is deferred to call time by
          # _check_async(). Verified against a baseline wheel, where the import
          # succeeds and only the call raises. So this has to call.
          import asyncio
          import pathlib
          import tempfile

          from dataprof.asyncio import profile_file

          with tempfile.TemporaryDirectory() as d:
              csv = pathlib.Path(d) / "tiny.csv"
              csv.write_text("a,b\n1,2\n3,4\n", encoding="utf-8")
              report = asyncio.run(profile_file(str(csv)))
              assert report.rows == 2, report.rows
              assert report.columns == 2, report.columns
              print("async profile OK:", report.rows, "rows,", report.columns, "columns")

          print("OK")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: spike-wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

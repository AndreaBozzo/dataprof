name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10

jobs:
  # Step 1: Generate release notes and create GitHub release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0  # Need full history for changelog

    - name: Get tag and version info
      id: tag
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        VERSION=${TAG#v}
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Tag: $TAG, Version: $VERSION"

    # 1.96 is the workspace MSRV (`rust-version` in Cargo.toml); validating
    # release metadata on it also smoke-tests that the manifests still parse on
    # the oldest supported toolchain. Dependabot bumped this to 1.100 (#521),
    # a Rust that does not exist yet: dtolnay/rust-toolchain pre-creates version
    # branches, so a resolvable ref is no proof of a released toolchain. That
    # action is now on dependabot's ignore list.
    - name: Install Rust 1.96 for release metadata validation
      uses: dtolnay/rust-toolchain@1.96

    - name: Validate tag and release metadata
      env:
        # rust-toolchain.toml outranks the default toolchain the step
        # above installs; only this variable outranks the file.
        RUSTUP_TOOLCHAIN: '1.96'
        VERSION: ${{ steps.tag.outputs.version }}
      run: |
        mapfile -t WORKSPACE_VERSIONS < <(
          cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[].version' |
            sort -u
        )

        if [ "${#WORKSPACE_VERSIONS[@]}" -ne 1 ] ||
           [ "${WORKSPACE_VERSIONS[0]}" != "$VERSION" ]; then
          echo "::error::Tag v$VERSION does not match every workspace package version."
          printf 'Workspace versions: %s\n' "${WORKSPACE_VERSIONS[*]}"
          exit 1
        fi

        START_COUNT=$(grep -c '^<!-- release-body:start -->$' docs/release-notes.md || true)
        END_COUNT=$(grep -c '^<!-- release-body:end -->$' docs/release-notes.md || true)
        if [ "$START_COUNT" -ne 1 ] || [ "$END_COUNT" -ne 1 ]; then
          echo "::error::docs/release-notes.md must contain one release-body marker pair."
          exit 1
        fi

        if ! grep -Fq "# dataprof $VERSION " docs/release-notes.md; then
          echo "::error::Release-note title does not match v$VERSION."
          exit 1
        fi

        NARRATIVE=$(awk '
          /^<!-- release-body:start -->$/ { capture = 1; next }
          /^<!-- release-body:end -->$/ { capture = 0; next }
          capture { print }
        ' docs/release-notes.md)
        if [ -z "${NARRATIVE//[[:space:]]/}" ]; then
          echo "::error::The marked release narrative is empty."
          exit 1
        fi

    - name: Generate changelog with git-cliff
      id: git-cliff
      uses: orhun/git-cliff-action@v4
      with:
        config: cliff.toml
        args: --current --strip header
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build release notes
      env:
        CLIFF_OUTPUT: ${{ steps.git-cliff.outputs.content }}
      run: |
        TAG="${{ steps.tag.outputs.tag }}"
        VERSION="${{ steps.tag.outputs.version }}"

        if [ -z "${CLIFF_OUTPUT//[[:space:]]/}" ]; then
          echo "::error::git-cliff produced an empty changelog."
          exit 1
        fi

        NARRATIVE=$(awk '
          /^<!-- release-body:start -->$/ { capture = 1; next }
          /^<!-- release-body:end -->$/ { capture = 0; next }
          capture { print }
        ' docs/release-notes.md)

        # Nest git-cliff's version/category headings under "Full changelog".
        CLIFF_OUTPUT=$(printf '%s\n' "$CLIFF_OUTPUT" |
          sed -e 's/^### /#### /' -e 's/^## /### /')

        {
          printf '%s\n' "$NARRATIVE"
          echo ""
          echo "## Full changelog"
          echo ""
          printf '%s\n' "$CLIFF_OUTPUT"
          echo ""
          echo "## Release artifacts"
          echo ""
          echo "### Python"
          echo "- **PyPI**: \`pip install dataprof==$VERSION\`"
          echo "- **GitHub Releases**: Baseline and optimized wheels are attached as release assets"
          echo ""
          echo "### Source"
          echo "- GitHub automatically attaches source \`.tar.gz\` and \`.zip\` archives for this tag"
          echo ""
          echo "### Rust"
          echo "- **Crates.io**: \`cargo add dataprof@$VERSION\`"
          echo "- The published \`dataprof\` crate is the stable Rust facade for profiling files, streams, tables, and database queries."
          echo "- Internal workspace crates are published so the facade can depend on versioned packages."
          echo "- This release ships libraries and Python packages; a CLI binary is not part of the release surface."
          echo ""
          echo "---"
          echo ""
          echo "**Versioned documents**: [full changelog](https://github.com/AndreaBozzo/dataprof/blob/$TAG/docs/CHANGELOG.md) · [release notes and migration guide](https://github.com/AndreaBozzo/dataprof/blob/$TAG/docs/release-notes.md)"
        } > release_notes.md

        echo "Release body preview:"
        cat release_notes.md

    - name: Create GitHub Release
      run: |
        echo "Creating release ${{ steps.tag.outputs.tag }}..."
        if gh release view ${{ steps.tag.outputs.tag }} >/dev/null 2>&1; then
          gh release edit ${{ steps.tag.outputs.tag }} \
            --title "dataprof ${{ steps.tag.outputs.tag }}" \
            --notes-file release_notes.md \
            --draft=true
        else
          gh release create ${{ steps.tag.outputs.tag }} \
            --title "dataprof ${{ steps.tag.outputs.tag }}" \
            --notes-file release_notes.md \
            --draft
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Step 2: Validate the Rust release surfaces before publishing crates.
  rust-release-checks:
    name: Validate Rust Release Surface
    runs-on: ubuntu-latest
    needs: create-release
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        cache-prefix: rust-release
        components: ''
    - name: Verify released facade surface
      run: |
        cargo check --locked -p dataprof --all-features
        cargo check --locked -p dataprof --lib --no-default-features
        cargo check --locked -p dataprof --lib --no-default-features --features async-streaming
        cargo test --locked --test public_api_facade --no-default-features
        cargo test --locked --test public_api_facade --no-default-features --features async-streaming
        cargo test --locked --test public_api_facade --all-features
        cargo test --locked -p dataprof-engines --all-features
        cargo test --locked -p dataprof-json --all-features
        cargo test --locked -p dataprof-parquet --all-features
        cargo test --locked -p dataprof-partial --all-features
        cargo check --locked -p dataprof-python --all-features
      shell: bash

  # Step 2b: the same published surfaces, compiled on the *minimum* supported
  # compiler rather than the pinned one. The job above proves the release builds
  # for us; this one proves it builds for a downstream crate that took the MSRV
  # in Cargo.toml at its word. #674.
  msrv:
    name: Validate MSRV Compile Gate
    runs-on: ubuntu-latest
    needs: create-release
    env:
      # rust-toolchain.toml outranks the default toolchain the install step
      # sets; only this variable outranks the file.
      RUSTUP_TOOLCHAIN: '1.96'
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust 1.96 (workspace MSRV)
      uses: dtolnay/rust-toolchain@1.96

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Compile MSRV feature graphs
      run: python3 .github/scripts/msrv_check.py
      shell: bash

  # Step 3: Verify every crate's packaged contents before the first real publish.
  # Full `cargo publish --dry-run` is not viable for interdependent workspace crates
  # because crates.io cannot resolve unpublished internal versions yet.
  rust-package-checks:
    name: Check Rust Package Contents
    runs-on: ubuntu-latest
    needs: [rust-release-checks, msrv]
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        cache-prefix: rust-package-checks
        components: ''

    - name: Check workspace crate package contents
      run: |
        set -euo pipefail

        check_package_contents() {
          local crate="$1"
          echo "Checking package contents for ${crate}..."
          cargo package -p "${crate}" --list
        }

        check_package_contents dataprof-core
        check_package_contents dataprof-metrics
        check_package_contents dataprof-runtime
        check_package_contents dataprof-csv
        check_package_contents dataprof-json
        check_package_contents dataprof-db
        check_package_contents dataprof-parquet
        check_package_contents dataprof-engines
        check_package_contents dataprof-partial
        check_package_contents dataprof
      shell: bash

  # Step 4: Publish versioned Rust crates in dependency order.
  #
  # Gated on python-wheels as well as the package checks. A crates.io publish is
  # irreversible -- a version can be yanked but never replaced -- so we do not
  # spend it until every wheel has built. Otherwise a single flaky runner leaves
  # the version live on crates.io with nothing on PyPI, and the only way out is a
  # new version number.
  rust-crates:
    name: Publish Rust Crates
    runs-on: ubuntu-latest
    needs: [rust-package-checks, python-dist]
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Setup Rust
      uses: ./.github/actions/setup-rust
      with:
        cache-prefix: rust-publish
        components: ''

    - name: Publish workspace crates
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
      run: |
        set -euo pipefail
        VERSION="${GITHUB_REF#refs/tags/v}"
        PUBLISH_COOLDOWN_SECONDS=60

        if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
          echo "CRATES_TOKEN is required to publish Rust crates"
          exit 1
        fi

        crate_already_published() {
          local crate="$1"
          curl --silent --show-error --fail \
            "https://crates.io/api/v1/crates/${crate}/${VERSION}" >/dev/null 2>&1
        }

        wait_for_rate_limit_window() {
          local output="$1"
          local retry_after
          local now_ts
          local retry_ts
          local sleep_seconds

          retry_after=$(printf '%s\n' "${output}" | sed -n 's/.*Please try again after \(.* GMT\).*/\1/p' | tail -n 1)
          if [ -z "${retry_after}" ]; then
            return 1
          fi

          now_ts=$(date -u +%s)
          retry_ts=$(date -u -d "${retry_after}" +%s 2>/dev/null || true)
          if [ -z "${retry_ts}" ]; then
            return 1
          fi

          sleep_seconds=$((retry_ts - now_ts + 5))
          if [ "${sleep_seconds}" -lt 5 ]; then
            sleep_seconds=5
          fi

          echo "crates.io rate limit hit; waiting ${sleep_seconds}s until ${retry_after} before retrying..."
          sleep "${sleep_seconds}"
          return 0
        }

        publish_crate() {
          local crate="$1"
          if crate_already_published "${crate}"; then
            echo "${crate} v${VERSION} is already published; skipping"
            return 0
          fi

          while true; do
            echo "Publishing ${crate}..."
            set +e
            output=$(cargo publish -p "${crate}" --locked 2>&1)
            status=$?
            set -e
            echo "${output}"

            if [ "${status}" -eq 0 ]; then
              return 0
            fi

            if echo "${output}" | grep -Eiq 'already (uploaded|exists)|crate version .* is already uploaded'; then
              echo "${crate} is already published; continuing"
              return 0
            fi

            if echo "${output}" | grep -q 'status 429 Too Many Requests'; then
              if wait_for_rate_limit_window "${output}"; then
                continue
              fi
            fi

            exit "${status}"
          done
        }

        crates=(
          dataprof-core
          dataprof-metrics
          dataprof-runtime
          dataprof-csv
          dataprof-json
          dataprof-db
          dataprof-parquet
          dataprof-engines
          dataprof-partial
          dataprof
        )

        for index in "${!crates[@]}"; do
          publish_crate "${crates[$index]}"

          if [ "$index" -lt $((${#crates[@]} - 1)) ]; then
            echo "Cooling down ${PUBLISH_COOLDOWN_SECONDS}s before the next crates.io publish attempt..."
            sleep "${PUBLISH_COOLDOWN_SECONDS}"
          fi
        done
      shell: bash

  # Step 5: Build every Python wheel and the sdist, then install and smoke-test
  # them. release-rehearsal.yml runs the same workflow without publishing.
  python-dist:
    name: Python Distributions
    needs: [create-release, rust-release-checks]
    permissions:
      contents: read
    uses: ./.github/workflows/python-dist.yml
    with:
      sccache: true

  # Step 6: Attach the wheels and the sdist to the draft release.
  python-release-assets:
    name: Upload Python Distributions to Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [create-release, python-dist]
    steps:
    - name: Download wheels
      uses: actions/download-artifact@v8
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist

    - name: Download sdist
      uses: actions/download-artifact@v8
      with:
        name: python-sdist
        path: dist

    - name: Upload distributions to release
      run: |
        cd dist
        for file in *.whl *.tar.gz; do
          if [ -f "$file" ]; then
            echo "Uploading: $file"
            gh release upload ${{ needs.create-release.outputs.tag }} "$file" --clobber
          fi
        done
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No checkout in this job, so gh cannot read the repository from git.
        GH_REPO: ${{ github.repository }}

  # Step 7: Publish to PyPI after Rust crates are published.
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [rust-crates, python-dist]
    permissions:
      id-token: write
    steps:
    - name: Download baseline wheels only
      uses: actions/download-artifact@v8
      with:
        pattern: wheels-*-baseline
        merge-multiple: true
        path: dist

    - name: Download sdist
      uses: actions/download-artifact@v8
      with:
        name: python-sdist
        path: dist

    - name: Verify wheels for PyPI compatibility
      run: |
        cd dist
        echo "Verifying wheels for PyPI publishing..."
        for wheel in *.whl; do
          if [[ "$wheel" == *"-optimized.whl" ]]; then
            echo "Removing optimized wheel from PyPI upload: $wheel"
            rm "$wheel"
          else
            echo "PyPI-compatible wheel: $wheel"
          fi
        done

        wheel_count=$(find . -maxdepth 1 -name '*.whl' | wc -l)
        sdist_count=$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)
        echo "Total wheels for PyPI: $wheel_count"
        echo "Total sdists for PyPI: $sdist_count"
        if [ "$wheel_count" -eq 0 ] && [ "$sdist_count" -eq 0 ]; then
          echo "No Python distributions found for PyPI publishing"
          exit 1
        fi

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        skip-existing: true
        print-hash: true

  # Step 8: Finalize release (make it public)
  finalize-release:
    name: Finalize Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [create-release, rust-crates, pypi-publish, python-release-assets]
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Mark release as published
      run: |
        echo "Finalizing release ${{ needs.create-release.outputs.tag }}..."
        gh release edit ${{ needs.create-release.outputs.tag }} --draft=false
        echo "Release ${{ needs.create-release.outputs.tag }} is now public!"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Deploy Pages

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'docs/schema/**'
      - '.github/scripts/build_benchmark_pages.py'
      - '.github/workflows/deploy-pages.yml'

  workflow_run:
    workflows: ["Benchmarks"]
    types: [completed]
    branches: [master]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy site
    runs-on: ubuntu-latest
    # The workflow_run branch filter matches the head branch name, which a fork
    # PR controls, and a PR run executes the PR's own benchmarks.yml. Publish
    # only artifacts from pushes to this repository.
    if: >-
      ${{ github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      ) }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Resolve benchmark run
        id: bench-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"
          else
            # Site-only deploys reuse the newest successful benchmark run of a
            # push to master; --branch alone also matches a fork PR's branch.
            run_id="$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow benchmarks.yml \
              --branch master \
              --event push \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
          fi

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "Using benchmark run: ${run_id:-none found}"

      - name: Download benchmark artifacts
        id: bench-artifact
        if: steps.bench-run.outputs.run_id != ''
        continue-on-error: true # the artifact may have expired; the site still deploys
        uses: actions/download-artifact@v8
        with:
          name: benchmark-results
          path: benchmark-reports
          github-token: ${{ github.token }}
          run-id: ${{ steps.bench-run.outputs.run_id }}

      - name: Assemble site
        run: |
          set -euo pipefail

          mkdir -p pages-content
          cp -r site/. pages-content/
          mkdir -p pages-content/schema
          cp -r docs/schema/*.json pages-content/schema/

          if [ -d "benchmark-reports/target/criterion" ]; then
            mkdir -p pages-content/benchmarks
            cp -r benchmark-reports/target/criterion/. pages-content/benchmarks/
            if [ -f "benchmark-reports/benchmark-results/run-status.json" ]; then
              cp benchmark-reports/benchmark-results/run-status.json pages-content/benchmarks/
            fi
            if [ -d "benchmark-reports/benchmark-results/comparison" ]; then
              mkdir -p pages-content/benchmarks/comparison
              cp benchmark-reports/benchmark-results/comparison/results.json pages-content/benchmarks/comparison/
              cp benchmark-reports/benchmark-results/comparison/comparison.md pages-content/benchmarks/comparison/
              if [ -f "benchmark-reports/benchmark-results/comparison/progress.json" ]; then
                cp benchmark-reports/benchmark-results/comparison/progress.json pages-content/benchmarks/comparison/
              fi
            fi
            if [ -d "benchmark-reports/benchmark-results/boundaries" ]; then
              cp -r benchmark-reports/benchmark-results/boundaries pages-content/benchmarks/
            fi
            python3 .github/scripts/build_benchmark_pages.py pages-content/benchmarks
          else
            echo "No Criterion data available; publishing placeholder benchmarks page"
            python3 .github/scripts/build_benchmark_pages.py pages-content/benchmarks --placeholder
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-content

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

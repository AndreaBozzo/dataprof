name: Benchmarks

on:
  push:
    branches: [main, master]
    paths:
      - 'crates/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'python/dataprof/**'
      - 'pyproject.toml'
      - '.github/scripts/benchmark_comparison.py'
      - '.github/workflows/benchmarks.yml'

  pull_request:
    branches: [main, master]
    paths:
      - 'crates/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'python/dataprof/**'
      - 'pyproject.toml'
      - '.github/scripts/benchmark_comparison.py'
      - '.github/workflows/benchmarks.yml'

  workflow_dispatch:
    inputs:
      full_benchmark:
        description: 'Run full benchmarks (slower, more samples)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-prefix: rust-bench
          components: rustfmt

      - name: Build benchmarks
        run: cargo bench --no-run

      - name: Setup Python comparison environment
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            benches/pyproject.toml
            benches/uv.lock
            benches/.python-version
            pyproject.toml
            Cargo.lock

      - name: Run benchmarks
        run: |
          mkdir -p benchmark-results
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_benchmark }}" = "true" ]; then
            echo "Running full benchmark suite"
            cargo bench --bench benchmarks 2>&1 | tee benchmark-results/output.txt
          else
            echo "Running quick benchmark suite for CI"
            cargo bench --bench benchmarks -- 'csv_parsing|full_analysis' 2>&1 | tee benchmark-results/output.txt
          fi

      - name: Run tool comparison
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_benchmark }}" = "true" ]; then
            uv run --project benches --locked --reinstall-package dataprof python .github/scripts/benchmark_comparison.py
          else
            uv run --project benches --locked --reinstall-package dataprof python .github/scripts/benchmark_comparison.py --rows 1000 --iterations 3 --warmups 1
          fi

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmark-results/
            target/criterion/
          retention-days: 30

      - name: Summary
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep -E "(csv_parsing|full_analysis|throughput_metrics|time:|thrpt:)" benchmark-results/output.txt | head -80 >> $GITHUB_STEP_SUMMARY || echo "No results found"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat benchmark-results/comparison/comparison.md >> "$GITHUB_STEP_SUMMARY"

name: Benchmarks

on:
  push:
    branches: [main, master]
    paths:
      - 'crates/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'python/dataprof/**'
      - 'pyproject.toml'
      - '.github/scripts/benchmark_comparison.py'
      - '.github/scripts/benchmark_resources.py'
      - '.github/scripts/benchmark_boundaries.py'
      - 'python/tests/test_benchmark_boundaries.py'
      - 'python/tests/test_benchmark_resources.py'
      - 'python/tests/test_benchmark_comparison.py'
      - '.github/dependabot.yml'
      - '.github/workflows/benchmarks.yml'

  pull_request:
    branches: [main, master]
    paths:
      - 'crates/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'python/dataprof/**'
      - 'pyproject.toml'
      - '.github/scripts/benchmark_comparison.py'
      - '.github/scripts/benchmark_resources.py'
      - '.github/scripts/benchmark_boundaries.py'
      - 'python/tests/test_benchmark_boundaries.py'
      - 'python/tests/test_benchmark_resources.py'
      - 'python/tests/test_benchmark_comparison.py'
      - '.github/dependabot.yml'
      - '.github/workflows/benchmarks.yml'

  workflow_dispatch:
    inputs:
      full_benchmark:
        description: 'Run full benchmarks (slower, more samples)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-prefix: rust-bench
          components: rustfmt

      - name: Setup Python comparison environment
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            benches/pyproject.toml
            benches/uv.lock
            benches/.python-version
            pyproject.toml
            Cargo.lock

      - name: Install comparison dependencies
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          uv sync --project benches --locked --reinstall-package dataprof 2>&1 | tee benchmark-results/dependencies.txt

      - name: Preflight comparison imports
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          uv run --project benches --no-sync python .github/scripts/benchmark_comparison.py --preflight-only --output benchmark-results/preflight 2>&1 | tee benchmark-results/preflight.txt

      - name: Build benchmarks
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cargo bench --no-run 2>&1 | tee benchmark-results/build.txt

      - name: Run benchmarks
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_benchmark }}" = "true" ]; then
            echo "Running full benchmark suite"
            cargo bench --bench benchmarks 2>&1 | tee benchmark-results/output.txt
          else
            echo "Running quick benchmark suite for CI"
            cargo bench --bench benchmarks -- 'csv_parsing|full_analysis' 2>&1 | tee benchmark-results/output.txt
          fi

      - name: Run tool comparison
        id: comparison
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_benchmark }}" = "true" ]; then
            uv run --project benches --no-sync python .github/scripts/benchmark_comparison.py --resources --host-description "GitHub-hosted runner; resource collection smoke test only" 2>&1 | tee benchmark-results/comparison.txt
          else
            uv run --project benches --no-sync python .github/scripts/benchmark_comparison.py --resources --host-description "GitHub-hosted runner; resource collection smoke test only" --rows 1000 --iterations 3 --warmups 1 2>&1 | tee benchmark-results/comparison.txt
          fi

      - name: Run Python boundary experiment
        id: boundaries
        shell: bash
        run: |
          set -euo pipefail
          uv run --project benches --no-sync python .github/scripts/benchmark_boundaries.py --rows 1000 --chunks 250 --iterations 2 --warmups 1 --budget-seconds 300 --host-description "GitHub-hosted runner; diagnostic smoke only" 2>&1 | tee benchmark-results/boundaries.txt

      - name: Record run status
        if: always()
        env:
          BENCHMARK_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          steps = json.loads(os.environ["BENCHMARK_STEPS"])
          outcomes = {name: steps.get(name, {}).get("outcome", "skipped")
                      for name in ("dependencies", "preflight", "build", "rust", "comparison", "boundaries")}
          status = "complete" if all(value == "success" for value in outcomes.values()) else "incomplete"
          output = Path("benchmark-results")
          output.mkdir(exist_ok=True)
          (output / "run-status.json").write_text(json.dumps({"status": status, "stages": outcomes}, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"## Benchmark run: {status}\n\n")
              for name, outcome in outcomes.items():
                  summary.write(f"- {name}: {outcome}\n")
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmark-results/
            target/criterion/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep -E "(csv_parsing|full_analysis|throughput_metrics|time:|thrpt:)" benchmark-results/output.txt | head -80 >> $GITHUB_STEP_SUMMARY || echo "No results found"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          if [ -f benchmark-results/comparison/comparison.md ]; then
            cat benchmark-results/comparison/comparison.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Comparison incomplete; see run-status.json, progress.json and logs in the artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

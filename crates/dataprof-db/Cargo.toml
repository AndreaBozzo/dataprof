[package]
name = "dataprof-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Database connectivity and query profiling support for dataprof"
readme = "README.md"

[features]
default = []
# `sqlx/bigdecimal` rides with the two backends that have a decimal type.
# SQLite has none, so a sqlite-only build does not pay for it. `futures`
# reads the row stream a profiled query is executed through.
postgres = ["dep:sqlx", "dep:futures", "sqlx/postgres", "sqlx/bigdecimal"]
mysql = ["dep:sqlx", "dep:futures", "sqlx/mysql", "sqlx/bigdecimal"]
sqlite = ["dep:sqlx", "dep:futures", "sqlx/sqlite"]
all-db = ["postgres", "mysql", "sqlite"]

[dependencies]
async-trait = { workspace = true }
dataprof-core = { workspace = true }
dataprof-metrics = { workspace = true }
dataprof-runtime = { workspace = true }
futures = { workspace = true, optional = true }
log = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"] }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
